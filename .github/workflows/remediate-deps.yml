# Triggered only when this remediation workflow itself changes on the isolated website work branch.
# The previous run verified zero remaining advisories but raced with a branch update; rerun against the latest head.
name: Remediate compatible npm vulnerabilities

on:
  push:
    branches:
      - echo/website-audit-completion-2026-10-14
    paths:
      - .github/workflows/remediate-deps.yml

permissions:
  contents: write

concurrency:
  group: dependency-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    name: Apply compatible audit fixes and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out working branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply compatible security updates
        run: npm audit fix
      - name: Summarize remaining advisories
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('Remaining npm audit counts:', JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, vulnerability] of Object.entries(audit.vulnerabilities ?? {})) {
            const advisories = (vulnerability.via ?? []).filter((item) => typeof item === 'object').map((item) => item.title).join('; ');
            console.log(`${name}: severity=${vulnerability.severity}; direct=${vulnerability.isDirect}; range=${vulnerability.range}; fixAvailable=${JSON.stringify(vulnerability.fixAvailable)}; advisories=${advisories || 'see npm audit JSON'}`);
          }
          NODE
      - name: TypeScript typecheck
        run: npm run lint
      - name: Unit and smoke tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified lockfile changes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No compatible dependency updates were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: apply compatible npm audit fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
